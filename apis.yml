aid: fig
name: Fig
description: >-
  Fig (Fig Loans) is a socially conscious, CDFI-certified fintech lender founded
  in 2015 and based in Texas that offers small-dollar installment loans as a
  responsible alternative to payday loans, along with credit-builder loans that
  help underserved borrowers establish and improve their credit. Loans typically
  range from a few hundred dollars over four-to-six-month terms, and Fig reports
  repayment to the three major consumer credit bureaus so on-time payments build
  credit history. Fig operates across a growing set of U.S. states including
  Texas, Missouri, Ohio, Utah, Florida, Illinois, and California, and partners
  with CDFIs and nonprofits on community-lending programs. Backed by General
  Catalyst and Techstars, Fig is profiled in the API Evangelist network as a
  company; it is a consumer-facing lender and does not publish a public developer
  API.
